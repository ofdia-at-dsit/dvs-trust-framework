name: Update caution block

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run the caution block updater
        run: |
          python supporting-material/scripts/update_caution_block.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: Apply caution block across workspace Markdown files
          branch: automation/update-caution-block
          delete-branch: true
          title: Apply caution block across workspace Markdown files
          body: |
            Automated update generated by the caution block workflow.
