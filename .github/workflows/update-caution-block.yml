name: Update caution block

on:
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write      # lets the job commit its changes back

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run the caution block updater
        run: python supporting-material/scripts/update_caution_block.py

      - name: Commit any changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Apply caution block across workspace Markdown files"
          git push
